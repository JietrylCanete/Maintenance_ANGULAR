<div class="container">

    <h1 class="mb-4">Submit Maintenance Request</h1>

    <div *ngIf="error" class="alert alert-danger">
        {{ error }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="mb-3">
            <label class="form-label">Title</label>

            <input
                type="text"
                formControlName="title"
                class="form-control"
                placeholder="Example: Leaking faucet"
                [ngClass]="{ 'is-invalid': submitted && f.title.errors }"
            >

            <div *ngIf="submitted && f.title.errors" class="invalid-feedback">
                Title is required.
            </div>
        </div>


        <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea
                formControlName="description"
                class="form-control"
                rows="5"
                placeholder="Describe the maintenance problem..."
                [ngClass]="{ 'is-invalid': submitted && f.description.errors }"
            ></textarea>

            <div *ngIf="submitted && f.description.errors" class="invalid-feedback">
                Description is required.
            </div>
        </div>


        <div class="mb-3">
            <label class="form-label">Location</label>

            <input
                type="text"
                formControlName="location"
                class="form-control"
                placeholder="Example: Room 203"
                [ngClass]="{ 'is-invalid': submitted && f.location.errors }"
            >

            <div *ngIf="submitted && f.location.errors" class="invalid-feedback">
                Location is required.
            </div>
        </div>


        <div class="mb-3">
            <label class="form-label">Attach Image</label>

            <input
                type="file"
                class="form-control"
                accept="image/jpeg,image/png,image/jpg,image/webp"
                (change)="onFileSelected($event)"
            >

            <small *ngIf="selectedFile" class="text-muted">
                Selected: {{ selectedFile.name }}
            </small>
        </div>


        <button
            type="submit"
            class="btn btn-primary"
            [disabled]="loading"
        >
            {{ loading ? 'Submitting...' : 'Submit Request' }}
        </button>

        <a
            routerLink="/maintenance"
            class="btn btn-secondary ms-2"
        >
            Cancel
        </a>

    </form>

</div>
