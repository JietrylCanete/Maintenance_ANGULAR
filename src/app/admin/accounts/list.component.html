<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h1>Accounts</h1>
        <p>All accounts from the secure (admin only) API endpoint</p>
    </div>
    <a routerLink="add" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i> Create Account
    </a>
</div>

<div class="card table-card">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th style="width:28%">Name</th>
                    <th style="width:28%">Email</th>
                    <th style="width:12%">Role</th>
                    <th style="width:24%">Capabilities</th>
                    <th style="width:8%"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let account of accounts">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="mini-avatar">{{ account.firstName?.charAt(0) }}</div>
                            <span class="fw-medium">{{account.title}} {{account.firstName}} {{account.lastName}}</span>
                        </div>
                    </td>
                    <td class="text-muted">{{account.email}}</td>
                    <td>
                        <span class="badge-role" [ngClass]="'role-' + (account.role || '').toLowerCase()">{{account.role}}</span>
                    </td>
                    <td>
                        <span *ngFor="let capability of account.capabilities" class="chip">{{ capability }}</span>
                        <span *ngIf="!account.capabilities?.length" class="text-muted">-</span>
                    </td>
                    <td class="text-end" style="white-space: nowrap">
                        <a routerLink="edit/{{account.AccountId}}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil-square me-1"></i>Edit
                        </a>
                    </td>
                </tr>
                <tr *ngIf="accounts && accounts.length === 0">
                    <td colspan="5" class="text-center text-muted py-4">No accounts found.</td>
                </tr>
                <tr *ngIf="!accounts">
                    <td colspan="5" class="text-center py-4">
                        <span class="spinner-border spinner-border-lg align-center"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
