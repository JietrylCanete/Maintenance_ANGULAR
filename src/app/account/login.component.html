<div class="auth-header">
    <h3>Welcome back</h3>
    <p>Sign in to manage maintenance requests</p>
</div>
<div class="card-body auth-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" formControlName="email" class="form-control" placeholder="you@school.edu" [ngClass]="{ 'is-invalid': submitted && f.email.errors }" />
            <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                <div *ngIf="f.email.errors.required">Email is required</div>
                <div *ngIf="f.email.errors.email">Email is invalid</div>
            </div>
        </div>
        <div class="mb-3">
            <div class="d-flex justify-content-between">
                <label class="form-label">Password</label>
                <a routerLink="../forgot-password" class="auth-link small">Forgot password?</a>
            </div>
            <input type="password" formControlName="password" class="form-control" placeholder="Enter your password" [ngClass]="{ 'is-invalid': submitted && f.password.errors }" />
            <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                <div *ngIf="f.password.errors.required">Password is required</div>
            </div>
        </div>
        <button [disabled]="submitting" class="btn btn-primary w-100 py-2">
            <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
            Sign in
        </button>
        <p class="text-center text-muted mt-4 mb-0">
            Don't have an account? <a routerLink="../register" class="auth-link">Register</a>
        </p>
    </form>
</div>
