<div class="auth-header">
    <h3>Forgot password?</h3>
    <p>Enter your email and we'll send you reset instructions</p>
</div>
<div class="card-body auth-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" formControlName="email" class="form-control" placeholder="you@school.edu" [ngClass]="{ 'is-invalid': submitted && f.email.errors }" />
            <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                <div *ngIf="f.email.errors.required">Email is required</div>
                <div *ngIf="f.email.errors.email">Email is invalid</div>
            </div>
        </div>
        <button [disabled]="loading" class="btn btn-primary w-100 py-2">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            Send reset link
        </button>
        <p class="text-center mt-4 mb-0">
            <a routerLink="../login" class="auth-link">Back to sign in</a>
        </p>
    </form>
</div>
